  <style>
    /* Tokens taken from Figma node 88:10140 (Desktop - 6), a 1440x1024 frame. */
    :root {
      --ink: #030303;
      --grad-start: #FF9201;
      --grad-end: #9556EB;

      /* Both wash layers use the same fill; only the blend mode differs. */
      --wash: linear-gradient(125.0026deg, var(--grad-start) 0.50658%, var(--grad-end) 100%);

      /* Mark bottom 468.86 -> label top 499.16, label bottom 530.16 -> icon top 629.10. */
      --gap-mark-to-label: 24px;
      --gap-label-to-social: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background-color: var(--ink);
      font-family: "Almarai", system-ui, -apple-system, sans-serif;
    }

    /* ---- Backdrop -----------------------------------------------------------
    Three Figma layers, bottom to top: the photo (blur 12.5, opacity 75%),
    then the brand gradient twice — once plus-lighter, once hard-light. The
    frame fill behind the 75% photo is the brand black, which is what keeps
    the result warm. `isolation` keeps the blends off the rest of the page. */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      isolation: isolate;
      overflow: hidden;
      background-color: var(--ink);
      pointer-events: none;
    }

    /* Figma frames the 2007.8x1123.6 photo box at (-537.08, -49.78) in 1440x1024. */
    .backdrop__photo {
      position: absolute;
      left: -37.297%;
      top: -4.861%;
      width: 139.433%;
      height: 109.722%;
      object-fit: cover;
      opacity: 0.75;
      /* The photo is desaturated before the washes colour it — back-solving the
      Figma composite gives a neutral base, not the photo's own blues. */
      filter: grayscale(1) blur(12.5px);
    }

    .backdrop__wash {
      position: absolute;
      inset: 0;
      background-image: var(--wash);
    }

    /* Without plus-lighter this falls back to normal and flattens to the
    gradient, which is an acceptable degradation. */
    .backdrop__wash--lighter {
      mix-blend-mode: plus-lighter;
    }

    .backdrop__wash--hard {
      mix-blend-mode: hard-light;
    }

    /* ---- Oversized wordmarks ------------------------------------------------
    1440-wide vectors pinned flush to the top and bottom edges of the frame.
    The 10% ink opacity is baked into the SVGs. */
    .edge-word {
      position: fixed;
      left: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .edge-word--top {
      top: 0;
    }

    .edge-word--bottom {
      bottom: 0;
    }

    main {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* ---- Logo mark ----------------------------------------------------------
    A 106.77x105.96 box holding three stacked layers: a blurred shadow, the
    gradient base, and the black linework over it. Each layer's artwork bleeds
    past the box by a different amount, so they are pinned by the offsets
    Figma reports rather than centred — each SVG keeps its intrinsic size. */
    .mark {
      position: relative;
      width: 106.769px;
      height: 105.959px;
    }

    .mark img {
      position: absolute;
      max-width: none;
    }

    .mark__shadow {
      left: -4.527px;
      top: -4.178px;
    }

    .mark__base {
      left: -4.576px;
      top: -0.5px;
    }

    .mark__detail {
      left: -0.288px;
      top: -0.25px;
    }

    .label {
      margin: var(--gap-mark-to-label) 0 0;
      font-size: clamp(1.0625rem, 1.944vw, 1.75rem);
      /* 28px at 1440 */
      font-weight: 800;
      line-height: normal;
      letter-spacing: 0.05em;
      /* 1.4px at 28px */
      color: rgba(0, 0, 0, 0.75);
      white-space: nowrap;
    }

    .email a {
      text-decoration: none;
      font-size: 16px;
      font-weight: 300;
      color: rgba(0, 0, 0, 0.75);
      font-family: "Work Sans", system-ui, -apple-system, sans-serif;
    }

    .email a:hover {
      opacity: 0.7;
    }

    /* ---- Social -------------------------------------------------------------
    Figma flattens this row into one shape, so the icons are drawn from the
    project's own Instagram/YouTube vectors — the same paths Figma exports.
    Links are padded to a 44px target, and the 14px gap plus that padding
    reproduces the design's 20px ink spacing either side of the rule. */
    .social {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 14px;
      /* The link padding is pulled back out of the column so the block centres on
      the icon ink, the way the design's 298.19px stack does. */
      margin-top: calc(var(--gap-label-to-social) - 6px);
      margin-bottom: -6px;
    }

    .social a {
      display: block;
      padding: 6px;
      border-radius: 8px;
      transition: opacity 160ms ease;
    }

    .social a:hover {
      opacity: 0.7;
    }

    .social a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .social__rule {
      width: 1px;
      height: 20px;
      border-radius: 0.5px;
      background-color: var(--ink);
    }

    /* The icon files are drawn in the old off-white; brightness(0) takes them to
    the design's ink without touching the vectors. */
    .icon {
      display: block;
      filter: brightness(0);
    }

    .icon--instagram {
      width: 28px;
      height: 28px;
    }

    .icon--youtube {
      width: 37.26px;
      height: 26.1px;
    }

    /* holds the 27:19 source ratio */

    /* No mobile frame was supplied. The wordmarks scale with the viewport on
    their own; the backdrop drops the desktop crop so the photo is not zoomed
    to a flat wash on a portrait screen, and the vertical rhythm tightens. */
    @media (max-width: 767px) {
      :root {
        --gap-label-to-social: 32px;
      }

      .backdrop__photo {
        left: -5%;
        top: -5%;
        width: 110%;
        height: 110%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
